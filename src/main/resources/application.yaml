spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
framework:
  infra:
    security:
      jwt:
        secret: ${JWT_SECRET}
        ttl-seconds: ${JWT_TTL_SECONDS:3600}